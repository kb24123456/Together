<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>A4 正式书写状态</title><style>body{font:16px system-ui;max-width:1000px;margin:32px auto;padding:0 24px;color:#222;background:#f7f7f7}h1{font-size:24px}p{color:#666;line-height:1.6}.row{display:flex;gap:20px;flex-wrap:wrap}.card{padding:16px;background:white;border-radius:16px;flex:1;min-width:280px}.dark{background:#151515;color:#ddd}video{display:block;width:100%;max-width:450px;margin:12px auto}button{font:inherit;padding:8px 14px;border:1px solid #ccc;border-radius:8px;background:white;cursor:pointer}.small{height:100px;display:flex;align-items:center;gap:20px}.small video{width:41.74px;margin:0}.small video:last-child{width:55.65px}</style><h1>A4 · 正式书写状态</h1><p>首页 → 开始书写 → 停笔 → 续写 → 返回首页。以下为正式 Mascot 状态机的实际播放素材。</p><div class="row"><div class="card">浅色<video id="light" controls autoplay loop muted playsinline src="final-light/preview.mov"></video><div class="small"><video autoplay loop muted playsinline src="final-30pt-light/preview.mov"></video><video autoplay loop muted playsinline src="final-40pt-light/preview.mov"></video></div></div><div class="card dark">深色<video id="dark" controls autoplay loop muted playsinline src="final-dark/preview.mov"></video><div class="small"><video autoplay loop muted playsinline src="final-30pt-dark/preview.mov"></video><video autoplay loop muted playsinline src="final-40pt-dark/preview.mov"></video></div></div></div><p><button onclick="document.querySelectorAll('video').forEach(v=>v.play())">播放</button> <button onclick="document.querySelectorAll('video').forEach(v=>v.pause())">暂停</button> <button onclick="document.querySelectorAll('video').forEach(v=>v.playbackRate=1)">原速</button> <button onclick="document.querySelectorAll('video').forEach(v=>v.playbackRate=.5)">半速</button></p><p>小图球体约 30 / 40pt。实际真机观感与能耗需在安装后的 App 中确认。</p></html>
