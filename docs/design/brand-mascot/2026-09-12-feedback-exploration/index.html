<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>小球与结果反馈 · 三种视觉关系</title>
<!-- 动效方向探索；任务列表为示意，角色使用 App 当前真实静态素材。保留单一可见角色，以运动路径与轮廓连接反馈。未修改 App，时序为设计提案。 -->
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f5f3;color:#191919;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}button,select,input{font:inherit}button,select{color:inherit}button{cursor:pointer}main{max-width:1280px;margin:auto;padding:44px 40px 32px}.eyebrow{font-size:12px;letter-spacing:.12em;color:#777}h1{font-size:32px;letter-spacing:-.04em;margin:12px 0}header p{color:#696966;line-height:1.7;font-size:15px;margin:0;max-width:740px}.controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:25px 0 30px}.controls button,.controls select,.replay{border:1px solid #d5d5d1;border-radius:99px;background:transparent;padding:9px 15px;font-size:13px}.controls .primary{background:#202020;color:white;border-color:#202020}.controls label{font-size:13px;margin-left:6px;display:flex;align-items:center;gap:5px}.controls input{accent-color:#222}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:30px}.heading{display:flex;gap:10px;align-items:baseline;margin-bottom:13px}.num{font-size:12px;color:#969690}h2{font-size:18px;letter-spacing:-.02em;margin:0}.recommend{font-size:11px;margin-left:auto;border:1px solid #ccc;border-radius:30px;padding:3px 8px;color:#555}.device{position:relative;width:100%;aspect-ratio:390/780;border:1px solid #d1d1cc;border-radius:43px;overflow:hidden;background:#fff;box-shadow:0 12px 34px #00000006;--ink:#171717;--muted:#838383;--paper:#fff;--pill:#101010;--onpill:#fafafa}.screen{position:absolute;width:390px;height:780px;transform-origin:top left;background:var(--paper);color:var(--ink);overflow:hidden}.status{position:absolute;top:17px;left:31px;right:30px;display:flex;justify-content:space-between;font-size:13px;font-weight:650}.island{position:absolute;top:11px;left:141px;width:108px;height:29px;border-radius:99px;background:#000}.status-right{font-size:12px;letter-spacing:1px}.nav{position:absolute;top:63px;left:128px;display:flex;gap:20px;align-items:baseline;height:44px;padding-top:9px}.nav b{font-size:22px}.nav span{font-size:17px;color:#999}.list{position:absolute;top:144px;left:28px;right:28px}.date{display:flex;align-items:baseline;gap:9px;margin-bottom:25px}.date b{font-size:22px}.date span{font-size:14px;color:var(--muted)}.date small{margin-left:auto;font-size:12px;color:var(--muted)}.row{display:flex;gap:14px;margin-bottom:29px;align-items:flex-start;min-height:45px}.check{height:19px;width:19px;margin-top:3px;border:1px solid #bcbcbc;border-radius:6px;flex-shrink:0}.row h3{font-size:17px;font-weight:600;margin:0 0 6px;line-height:1.45}.row p{font-size:14px;color:var(--muted);margin:0;line-height:1.5}.tomorrow{margin-top:38px}.tomorrow .date{margin-bottom:22px}.moved{opacity:0}.bottom{position:absolute;bottom:40px;left:28px;right:28px;display:flex;justify-content:space-between;align-items:center}.toolbar-group{display:flex;align-items:center;gap:22px;padding:10px 17px;border-radius:30px;box-shadow:0 2px 12px #00000008;border:1px solid #aaa3;height:46px;background:var(--paper);color:var(--ink)}.tool{font-size:22px;font-weight:350;line-height:1}.home-indicator{position:absolute;bottom:9px;left:133px;width:124px;height:5px;border-radius:9px;background:var(--ink)}.actor{position:absolute;width:40px;height:40px;left:336px;top:66px;z-index:5;transform-origin:center}.portrait{position:absolute;inset:0;border-radius:50%;overflow:hidden}.portrait img{position:absolute;width:139.13%;height:139.13%;max-width:none;left:-19.565%;top:-19.565%}.confirm-pose{opacity:0}.feedback{position:absolute;z-index:4;background:var(--pill);color:var(--onpill);border-radius:99px;height:62px;display:flex;flex-direction:column;justify-content:center;box-shadow:0 4px 12px #00000010;opacity:0}.feedback strong{font-size:15px;line-height:1.45;font-weight:560}.feedback span{font-size:13px;line-height:1.6;opacity:.72}.speech{left:66px;top:118px;width:302px;padding:0 24px;text-align:center;transform-origin:calc(100% - 14px) top}.speech:before{content:"";position:absolute;right:20px;top:-8px;width:19px;height:20px;background:var(--pill);border-radius:3px;transform:rotate(35deg)}.speech strong,.speech span{position:relative}.delivery{left:92px;top:625px;width:274px;text-align:center;padding:0 20px}.delivery:before{content:"";position:absolute;left:-6px;top:24px;width:16px;height:16px;background:var(--pill);transform:rotate(45deg);border-radius:3px}.morph-shell{position:absolute;left:336px;top:66px;width:40px;height:40px;background:var(--pill);border-radius:999px;z-index:4;opacity:0}.morph-copy{position:absolute;left:91px;top:632px;width:234px;text-align:left;color:var(--onpill);z-index:6;opacity:0;pointer-events:none}.morph-copy strong{font-size:15px;line-height:1.45;font-weight:560;display:block}.morph-copy span{font-size:13px;line-height:1.6;opacity:.72}.caption{font-size:13px;color:#64645f;line-height:1.75;margin:17px 0 10px;min-height:68px}.caption strong{font-weight:550;color:#272727}.tradeoff{font-size:12px;color:#92928a;line-height:1.6;min-height:39px}.replay{margin-top:15px;padding:7px 13px;font-size:12px}.footer{display:flex;gap:16px;align-items:center;margin-top:30px;border-top:1px solid #dcdcd6;padding-top:18px;color:#85857e;font-size:12px;line-height:1.7}.timeline{flex:1;accent-color:#222;min-width:60px}.time{font-variant-numeric:tabular-nums;width:48px}.dark .device{--ink:#efefef;--muted:#969696;--paper:#191919;--pill:#e8e8e8;--onpill:#161616;border-color:#333}.dark .check{border-color:#777}.dark .toolbar-group{border-color:#ffffff20}.reduced-note{margin-top:12px;font-size:12px;color:#7a7a72}.inspect .device{box-shadow:none}@media(max-width:940px){main{padding:30px 24px}.grid{gap:20px}.heading{flex-wrap:wrap}h2{font-size:16px}.recommend{margin-left:0}.caption{min-height:95px}}@media(max-width:680px){main{padding:26px 22px}.grid{grid-template-columns:1fr;gap:36px;max-width:370px;margin:auto}.caption,.tradeoff{min-height:0}h1{font-size:27px}.footer{flex-wrap:wrap}.footer>span:last-child{width:100%}.recommend{margin-left:auto}}
</style></head><body><main>
<header><div class="eyebrow">TOGETHER / 反馈动效探索</div><h1>让小球成为这条消息的主角。</h1><p>看见同一个小球、看见消息从它身边出现，或看见它亲自变成消息。三种方案使用相同任务与结果文案，只比较视觉上的联系。</p></header>
<div class="controls"><button class="primary" id="play">一起播放</button><button id="hold">定格比较</button><select id="event" aria-label="修改类型"><option value="time">修改时间</option><option value="notes">修改备注</option><option value="follow">关注任务</option></select><button id="theme">切换深色</button><label><input type="checkbox" id="reduce">减少动态效果</label></div>
<section class="grid" aria-label="三个方向对比"></section>
<div class="footer"><span>逐帧比较</span><input class="timeline" id="seek" aria-label="动画播放位置" type="range" min="0" max="5.2" value="0" step="0.01"><span class="time">0.0 秒</span><span>示意任务列表 · 真实小球姿态组合 · 非 App 运行录像</span></div>
<p class="reduced-note">专属动作草案「报信」：轻点头 → 短眨眼确认 → 带出结果 → 安静陪伴 → 恢复。当前用真实姿态素材组合演示；新动作的连续眼型留待选定方向后制作。深色沿用现有柔白球，减少动态效果时统一为小球旁的静态气泡。</p>
</main><script>
const variants=[{name:'在原位说话',kind:'speech',lead:'消息就在小球身边展开。',copy:'小球轻点头、短眨眼，黑色气泡从它下方展开；气泡尖端朝向小球。',trade:'联系靠距离与朝向建立。提示出现时，日期区会轻微下移。',recommend:true},{name:'亲自送达',kind:'delivery',lead:'小球来到底部，再带出消息。',copy:'同一颗小球沿右缘落下，停在消息左侧，结果从身边展开，读完后返回。',trade:'角色身份最直接；每次都经过较长路径，打扰感更高。'},{name:'变成消息',kind:'morph',lead:'小球就是这枚胶囊。',copy:'小球落到下方，圆形连续展开为黑色胶囊；眼睛留在左端，文字在身侧出现。',trade:'形态联系最强；从移动到展开，比普通提示更有表演感。'}];
const icons='<span class="toolbar-group"><span class="tool">☰</span></span><span class="toolbar-group"><span class="tool">⌑</span><span class="tool">＋</span></span>';
const rows=`<div class="date"><b>9月12日</b><span>星期六</span><small>本周 5</small></div><div class="row target"><i class="check"></i><div><h3>整理本周计划</h3><p class="task-meta">09:00 · 提前 10 分钟提醒</p></div></div><div class="row"><i class="check"></i><div><h3>买牛奶和水果</h3><p>回家路上顺便带上</p></div></div><div class="row"><i class="check"></i><div><h3>读完这一章</h3><p>子任务 1/3</p></div></div><div class="tomorrow"><div class="date"><b>明天</b><span>星期日</span></div><div class="row"><i class="check"></i><div><h3>出门散步</h3><p>17:00</p></div></div><div class="row moved"><i class="check"></i><div><h3>整理本周计划</h3><p>09:00 · 提前 10 分钟提醒</p></div></div></div>`;
document.querySelector('.grid').innerHTML=variants.map((v,i)=>`<article data-kind="${v.kind}"><div class="heading"><span class="num">0${i+1}</span><h2>${v.name}</h2>${v.recommend?'<span class="recommend">优先推荐</span>':''}</div><div class="device"><div class="screen"><div class="status"><span>9:41</span><span class="status-right">▮▮▮ ▰</span></div><div class="island"></div><div class="nav"><b>待办</b><span>定期</span></div><div class="list">${rows}</div><div class="bottom">${icons}</div><div class="home-indicator"></div><div class="morph-shell"></div><div class="actor"><div class="portrait"><img class="idle-pose" alt="Together 小球" src="assets/idle.png"><img class="confirm-pose" alt="" src="assets/wink.png"></div></div><div class="feedback ${v.kind==='delivery'?'delivery':'speech'}"><strong>整理本周计划</strong><span class="result">已改到明天 · 09:00</span></div><div class="morph-copy"><strong>整理本周计划</strong><span class="result">已改到明天 · 09:00</span></div></div></div><p class="caption"><strong>${v.lead}</strong><br>${v.copy}</p><div class="tradeoff">${v.trade}</div><button class="replay" data-index="${i}">播放这个方案</button></article>`).join('');
const cards=[...document.querySelectorAll('article')].map(el=>({el,screen:el.querySelector('.screen'),actor:el.querySelector('.actor'),feedback:el.querySelector('.feedback'),shell:el.querySelector('.morph-shell'),copy:el.querySelector('.morph-copy'),list:el.querySelector('.list'),target:el.querySelector('.target'),moved:el.querySelector('.moved')}));
const clamp=x=>Math.max(0,Math.min(1,x)),smooth=x=>{x=clamp(x);return x*x*(3-2*x)},phase=(t,a,b)=>smooth((t-a)/(b-a)),lerp=(a,b,p)=>a+(b-a)*p;
let t=1.5,playing=false,last=null,selected=null;const duration=5.2;
function set(el,styles){Object.assign(el.style,styles)}
function path(p){const q=1-p;return {x:q*q*336+2*q*p*370+p*p*40,y:q*q*66+2*q*p*650+p*p*636}}
function render(time){
 const reduced=document.querySelector('#reduce').checked,type=document.querySelector('#event').value;
 cards.forEach((c,i)=>{
 const t=selected!==null&&selected!==i?0:time;
 const appear=phase(t,.2,.48),gone=phase(t,3.65,3.92),visible=appear*(1-gone);
 const move=phase(t,.2,.9)*(1-phase(t,4.05,4.75));
 const expand=phase(t,.85,1.18)*(1-phase(t,3.7,4.0));
 const read=phase(t,1.04,1.26)*(1-phase(t,3.55,3.74));
 const nod=reduced?0:Math.sin(clamp((t-.05)/.3)*Math.PI)*3;
 const confirmAt=i===0?.22:1.08;
 const confirm=reduced?0:phase(t,confirmAt,confirmAt+.09)*(1-phase(t,confirmAt+.27,confirmAt+.4));
 set(c.actor.querySelector('.confirm-pose'),{opacity:`${confirm}`});
 set(c.actor.querySelector('.idle-pose'),{opacity:`${1-confirm}`});
 const pos=path(move);
 set(c.actor,{left:'336px',top:'66px',width:'40px',height:'40px',transform:`translateY(${nod}px)`,opacity:'1'});
 set(c.feedback,{opacity:'0',transform:'none'});set(c.shell,{opacity:'0'});set(c.copy,{opacity:'0'});set(c.list,{transform:'none'});
 if(i===0){
  const open=reduced?(t>=.2&&t<3.92?1:0):phase(t,.19,.53)*(1-phase(t,3.8,4.08));
  set(c.feedback,{opacity:`${visible}`,transform:`scale(${reduced?1:lerp(.16,1,open)})`});
  set(c.list,{transform:`translateY(${open*62}px)`});
 }else if(i===1){
  if(reduced){set(c.feedback,{opacity:`${visible}`,left:'66px',top:'120px',width:'302px'});set(c.list,{transform:`translateY(${(t>=.2&&t<3.92?1:0)*62}px)`});c.feedback.classList.remove('delivery');c.feedback.classList.add('speech');}
  else {c.feedback.classList.remove('speech');c.feedback.classList.add('delivery');set(c.feedback,{left:'92px',top:'625px',width:'274px',opacity:`${read}`,transform:`scale(${lerp(.7,1,expand)})`,transformOrigin:'left center'});set(c.actor,{left:`${pos.x}px`,top:`${pos.y}px`,transform:`rotate(${Math.sin(move*Math.PI)*-12}deg)`});}
 }else{
  if(reduced){set(c.feedback,{opacity:`${visible}`,left:'66px',top:'120px',width:'302px'});set(c.list,{transform:`translateY(${(t>=.2&&t<3.92?1:0)*62}px)`});}
  else {
   const w=lerp(40,318,expand),h=lerp(40,64,expand),x=lerp(pos.x,36,expand),y=lerp(pos.y,624,expand);
   set(c.shell,{opacity:`${phase(t,.74,.91)*(1-phase(t,4.02,4.13))}`,left:`${x}px`,top:`${y}px`,width:`${w}px`,height:`${h}px`});
   set(c.actor,{left:`${lerp(pos.x,45,expand)}px`,top:`${lerp(pos.y,636,expand)}px`,transform:'none'});
   set(c.copy,{opacity:`${read}`});
  }
 }
 const changed=phase(t,.17,.42),isTime=type==='time';
 set(c.target,{opacity:`${isTime?1-changed:1}`,maxHeight:`${isTime?lerp(70,0,changed):70}px`,minHeight:`${isTime?lerp(45,0,changed):45}px`,marginBottom:`${isTime?lerp(29,0,changed):29}px`,overflow:'hidden'});
 set(c.moved,{opacity:`${isTime?changed:0}`});
 c.el.querySelectorAll('.result').forEach(x=>x.textContent=type==='time'?'已改到明天 · 09:00':type==='notes'?'备注已更新':'已关注任务');
 });
 document.querySelector('#seek').value=time;document.querySelector('.time').textContent=`${time.toFixed(1)} 秒`;
}
function fit(){cards.forEach(c=>c.screen.style.transform=`scale(${c.el.querySelector('.device').clientWidth/390})`)}
function start(index=null){selected=index;t=0;playing=true;last=null;render(0);document.querySelector('#play').textContent='重新一起播放'}
function tick(now){if(last===null){last=now;window.__ready=true;render(t)}else{if(playing){t=Math.min(duration,t+(now-last)/1000);render(t);if(t>=duration)playing=false;}last=now}requestAnimationFrame(tick)}
document.querySelector('#hold').onclick=()=>window.__seek(1.5);
document.querySelector('#play').onclick=()=>start();document.querySelectorAll('.replay').forEach(x=>x.onclick=()=>start(Number(x.dataset.index)));
document.querySelector('#event').onchange=()=>start();document.querySelector('#reduce').onchange=()=>start();
document.querySelector('#theme').onclick=()=>{const dark=document.body.classList.toggle('dark');cards.forEach(c=>{c.actor.querySelector('.idle-pose').src=`assets/${dark?'idle-white':'idle'}.png`;c.actor.querySelector('.confirm-pose').src=`assets/${dark?'wink-white':'wink'}.png`});document.querySelector('#theme').textContent=dark?'切换浅色':'切换深色';render(t)};
document.querySelector('#seek').oninput=e=>{playing=false;selected=null;t=Number(e.target.value);render(t)};
window.__seek=value=>{playing=false;selected=null;t=Math.max(0,Math.min(duration,value));render(t)};
window.addEventListener('resize',fit);document.fonts.ready.then(()=>{fit();render(t);requestAnimationFrame(tick)});
</script></body></html>
