<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Together 首页「本周」入口高保真图</title>

  <!--
    Assumptions
    1. 沿用 Together 当前浅色设计系统：纯白一级画布、平铺任务流、系统字体。
    2. 首页不增加两条导航行；日期栏右侧新增一个无背景入口和独立锚定的品牌二级菜单。
    3. 图中使用 12 项作为演示数据，仅用于表现数字宽度和菜单信息层级。
    4. 左图展示常驻入口，右图展示菜单展开态；交互仅用于设计评审，不代表生产实现。
  -->

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body, #root { width: 100%; min-height: 100%; }
    body {
      background: #f2f3f5;
      color: #292e30;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    button { font: inherit; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    // Copied from huashu-design/assets/ios_frame.jsx as required by the iOS prototype workflow.
    const iosFrameStyles = {
      wrapper: {
        display: 'inline-block',
        padding: 12,
        background: '#000',
        borderRadius: 60,
        boxShadow: '0 0 0 2px #1f2937, 0 20px 60px rgba(0,0,0,0.3)',
        position: 'relative',
      },
      screen: {
        position: 'relative',
        borderRadius: 48,
        overflow: 'hidden',
        background: '#fff',
      },
      statusBar: {
        position: 'absolute',
        top: 0,
        left: 0,
        right: 0,
        height: 54,
        display: 'flex',
        alignItems: 'center',
        justifyContent: 'space-between',
        padding: '0 32px 0 32px',
        fontSize: 16,
        fontWeight: 600,
        fontFamily: '-apple-system, "SF Pro Text", sans-serif',
        zIndex: 20,
        pointerEvents: 'none',
      },
      dynamicIsland: {
        position: 'absolute',
        top: 12,
        left: '50%',
        transform: 'translateX(-50%)',
        width: 124,
        height: 36,
        background: '#000',
        borderRadius: 999,
        zIndex: 30,
      },
      statusIcons: {
        display: 'flex',
        alignItems: 'center',
        gap: 6,
      },
      signalIcon: {
        display: 'flex',
        alignItems: 'flex-end',
        gap: 2,
        height: 12,
      },
      signalBar: {
        width: 3,
        background: 'currentColor',
        borderRadius: 1,
      },
      wifiIcon: {
        width: 16,
        height: 12,
        position: 'relative',
      },
      batteryIcon: {
        width: 26,
        height: 12,
        border: '1.5px solid currentColor',
        borderRadius: 3,
        padding: 1,
        position: 'relative',
        opacity: 0.8,
      },
      batteryCap: {
        position: 'absolute',
        top: 3,
        right: -3,
        width: 2,
        height: 6,
        background: 'currentColor',
        borderRadius: '0 1px 1px 0',
      },
      content: {
        position: 'absolute',
        top: 54,
        left: 0,
        right: 0,
        bottom: 34,
        overflow: 'auto',
      },
      homeIndicator: {
        position: 'absolute',
        bottom: 10,
        left: '50%',
        transform: 'translateX(-50%)',
        width: 140,
        height: 5,
        background: 'rgba(0,0,0,0.3)',
        borderRadius: 999,
        zIndex: 10,
      },
      homeIndicatorDark: {
        background: 'rgba(255,255,255,0.5)',
      },
    };

    function IosFrame({
      children,
      width = 393,
      height = 852,
      time = '9:41',
      battery = 100,
      darkMode = false,
      showStatusBar = true,
      showDynamicIsland = true,
      showHomeIndicator = true,
    }) {
      const textColor = darkMode ? '#fff' : '#000';

      return (
        <div style={iosFrameStyles.wrapper}>
          <div style={{
            ...iosFrameStyles.screen,
            width,
            height,
            background: darkMode ? '#000' : '#fff',
          }}>
            {showStatusBar && (
              <div style={{ ...iosFrameStyles.statusBar, color: textColor }}>
                <span>{time}</span>
                <div style={iosFrameStyles.statusIcons}>
                  <div style={iosFrameStyles.signalIcon}>
                    <div style={{ ...iosFrameStyles.signalBar, height: 4 }} />
                    <div style={{ ...iosFrameStyles.signalBar, height: 6 }} />
                    <div style={{ ...iosFrameStyles.signalBar, height: 9 }} />
                    <div style={{ ...iosFrameStyles.signalBar, height: 11 }} />
                  </div>
                  <svg width="16" height="12" viewBox="0 0 16 12" fill="none" style={{ color: textColor }}>
                    <path d="M8 11.5a1 1 0 100-2 1 1 0 000 2z" fill="currentColor" />
                    <path d="M3 7.5a7 7 0 0110 0" stroke="currentColor" strokeWidth="1.3" fill="none" strokeLinecap="round" />
                    <path d="M1 4.5a11 11 0 0114 0" stroke="currentColor" strokeWidth="1.3" fill="none" strokeLinecap="round" opacity="0.7" />
                  </svg>
                  <div style={iosFrameStyles.batteryIcon}>
                    <div style={{
                      width: `${battery}%`,
                      height: '100%',
                      background: 'currentColor',
                      borderRadius: 1,
                      opacity: 0.9,
                    }} />
                    <div style={iosFrameStyles.batteryCap} />
                  </div>
                </div>
              </div>
            )}

            {showDynamicIsland && <div style={iosFrameStyles.dynamicIsland} />}

            <div style={iosFrameStyles.content}>
              {children}
            </div>

            {showHomeIndicator && (
              <div style={{
                ...iosFrameStyles.homeIndicator,
                ...(darkMode ? iosFrameStyles.homeIndicatorDark : {}),
              }} />
            )}
          </div>
        </div>
      );
    }

    const palette = {
      background: '#ffffff',
      title: '#292e30',
      body: '#575c61',
      tertiary: '#b3b3b3',
      elevated: '#faf9f7',
      pill: '#f8f8f6',
      sky: '#6bb3fa',
      avatar: '#f5e0d6',
      hairline: 'rgba(41,46,48,.10)',
    };

    const tasks = [
      { title: '整理项目周报', note: '汇总本周进度与下周计划', time: '10:30', flag: true },
      { title: '确认明天会议材料', note: '检查演示文稿和附件', time: '14:00' },
      { title: '回复设计评审意见', note: '优先处理首页信息层级', tag: '3 个子任务' },
      { title: '预约年度体检', note: '', time: '16:30' },
      { title: '核对旅行清单', note: '证件、充电器、雨伞', tag: '2/5 子任务' },
      { title: '更新费用报销记录', note: '补充交通票据', time: '18:00' },
      { title: '整理书桌文件', note: '', tag: '4 个子任务' },
      { title: '给家里打电话', note: '确认周末安排', time: '20:30' },
    ];

    function CheckCircle({ checked = false }) {
      return (
        <span style={{
          width: 24,
          height: 24,
          flex: '0 0 24px',
          borderRadius: '50%',
          border: checked ? '1.5px solid #6bb3fa' : '1.3px dashed rgba(41,46,48,.32)',
          display: 'grid',
          placeItems: 'center',
          color: '#6bb3fa',
          fontSize: 15,
          fontWeight: 700,
        }}>
          {checked ? '✓' : ''}
        </span>
      );
    }

    function TaskRow({ task }) {
      return (
        <div style={{
          minHeight: task.note || task.time || task.tag ? 78 : 58,
          display: 'flex',
          alignItems: 'flex-start',
          gap: 12,
          padding: '13px 20px 10px',
          position: 'relative',
        }}>
          <div style={{ paddingTop: 1 }}><CheckCircle /></div>
          <div style={{ minWidth: 0, flex: 1 }}>
            <div style={{ display: 'flex', alignItems: 'center', gap: 7 }}>
              <div style={{
                color: palette.title,
                fontSize: 17,
                lineHeight: 1.25,
                fontWeight: 600,
                letterSpacing: '-.015em',
              }}>{task.title}</div>
              {task.flag && <span style={{ color: '#df7a69', fontSize: 13 }}>⚑</span>}
            </div>
            {task.note && (
              <div style={{
                marginTop: 5,
                color: 'rgba(87,92,97,.72)',
                fontSize: 13,
                lineHeight: 1.25,
                whiteSpace: 'nowrap',
                overflow: 'hidden',
                textOverflow: 'ellipsis',
              }}>{task.note}</div>
            )}
            {(task.time || task.tag) && (
              <div style={{ display: 'flex', gap: 6, marginTop: 7 }}>
                {task.time && <AttributePill text={task.time} />}
                {task.tag && <AttributePill text={task.tag} />}
              </div>
            )}
          </div>
        </div>
      );
    }

    function AttributePill({ text }) {
      return (
        <span style={{
          display: 'inline-flex',
          alignItems: 'center',
          minHeight: 22,
          padding: '0 8px',
          borderRadius: 999,
          background: palette.pill,
          color: 'rgba(87,92,97,.68)',
          fontSize: 11.5,
          fontWeight: 500,
        }}>{text}</span>
      );
    }

    function TopNavigation() {
      return (
        <div style={{
          height: 62,
          position: 'relative',
          display: 'flex',
          alignItems: 'center',
          justifyContent: 'center',
          background: 'rgba(255,255,255,.96)',
          zIndex: 6,
        }}>
          <div style={{ width: 144, height: 44, display: 'flex', alignItems: 'center' }}>
            <div style={{ width: 72, textAlign: 'center', color: palette.title, fontSize: 21.5, fontWeight: 750, letterSpacing: '-.03em' }}>待办</div>
            <div style={{ width: 72, textAlign: 'center', color: palette.tertiary, fontSize: 17, fontWeight: 400 }}>定期</div>
          </div>
          <button aria-label="打开个人页" style={{
            position: 'absolute',
            right: 14,
            width: 44,
            height: 44,
            border: 0,
            background: 'transparent',
            display: 'grid',
            placeItems: 'center',
            cursor: 'pointer',
          }}>
            <span style={{
              width: 40,
              height: 40,
              borderRadius: '50%',
              display: 'grid',
              placeItems: 'center',
              background: palette.avatar,
              boxShadow: `inset 0 0 0 .5px ${palette.hairline}`,
              color: 'rgba(41,46,48,.80)',
              fontSize: 17,
              fontWeight: 650,
            }}>纸</span>
          </button>
        </div>
      );
    }

    function WeekMenuButton({ menuOpen, onClick }) {
      return (
        <button
          data-testid="week-menu-button"
          aria-label="本周已完成 12 项，可查看完成记录或执行回顾"
          onClick={onClick}
          style={{
            minWidth: 82,
            minHeight: 44,
            padding: 0,
            border: 0,
            background: 'transparent',
            color: menuOpen ? 'rgba(87,92,97,.76)' : palette.tertiary,
            display: 'inline-flex',
            alignItems: 'center',
            justifyContent: 'flex-end',
            gap: 3,
            cursor: 'pointer',
            transition: 'opacity 160ms ease, transform 180ms cubic-bezier(.2,.8,.2,1)',
            opacity: menuOpen ? 0 : 1,
            transform: menuOpen ? 'scale(.72)' : 'scale(1)',
            transformOrigin: 'right center',
          }}
        >
          <span style={{ fontSize: 12, fontWeight: 550, whiteSpace: 'nowrap' }}>本周 12</span>
          <span style={{
            fontSize: 9,
            color: menuOpen ? palette.sky : 'currentColor',
            opacity: menuOpen ? 1 : .72,
            transform: menuOpen ? 'rotate(180deg)' : 'rotate(0deg)',
            transition: 'transform 240ms cubic-bezier(.2,.8,.2,1)',
          }}>⌄</span>
        </button>
      );
    }

    function DateBar({ menuOpen, setMenuOpen }) {
      return (
        <div style={{
          height: 54,
          display: 'flex',
          alignItems: 'center',
          gap: 8,
          padding: '0 12px 0 20px',
          position: 'relative',
          zIndex: 8,
        }}>
          <div style={{ display: 'flex', alignItems: 'baseline', gap: 6, minWidth: 0, flex: 1 }}>
            <span style={{
              fontSize: 22,
              lineHeight: 1,
              fontWeight: 650,
              letterSpacing: '-.025em',
              color: palette.title,
            }}>今天</span>
            <span style={{
              fontSize: 12,
              fontWeight: 550,
              color: palette.tertiary,
              whiteSpace: 'nowrap',
            }}>周三·8项</span>
          </div>
          <WeekMenuButton menuOpen={menuOpen} onClick={() => setMenuOpen(!menuOpen)} />
        </div>
      );
    }

    function WeeklyMenu({ menuOpen, onClose, onSelect }) {
      return (
        <div
          data-testid="menu-backdrop"
          onClick={onClose}
          aria-hidden={!menuOpen}
          style={{
            position: 'absolute',
            inset: 0,
            zIndex: 20,
            background: 'transparent',
            pointerEvents: menuOpen ? 'auto' : 'none',
          }}
        >
          <div
            data-testid="weekly-menu"
            data-state={menuOpen ? 'open' : 'closed'}
            onClick={(event) => event.stopPropagation()}
            style={{
              position: 'absolute',
              top: 67,
              right: 12,
              width: 196,
            }}
          >
            <button
              data-testid="completed-menu-item"
              onClick={() => onSelect('已打开「本周已完成」')}
              style={menuItemStyle(0, menuOpen)}
            >
              <span>本周已完成</span>
            </button>
            <button
              data-testid="review-menu-item"
              onClick={() => onSelect('已打开「执行回顾」')}
              style={menuItemStyle(1, menuOpen)}
            >
              <span>执行回顾</span>
            </button>
          </div>
        </div>
      );
    }

    function menuItemStyle(index, menuOpen) {
      return {
        width: '100%',
        minHeight: 44,
        border: 0,
        padding: 0,
        display: 'flex',
        alignItems: 'center',
        justifyContent: 'flex-start',
        gap: 10,
        background: 'transparent',
        color: palette.title,
        fontSize: 15,
        fontWeight: 650,
        textAlign: 'left',
        cursor: 'pointer',
        transformOrigin: 'right center',
        opacity: menuOpen ? 1 : 0,
        transform: menuOpen
          ? 'translateY(0) scale(1)'
          : `translateY(${-index * 48}px) scale(.42)`,
        transition: 'transform 270ms cubic-bezier(.2,.8,.2,1), opacity 150ms ease-out',
        willChange: 'transform, opacity',
      };
    }

    function BottomToolbar() {
      return (
        <div style={{
          position: 'absolute',
          left: 0,
          right: 0,
          bottom: 0,
          height: 72,
          display: 'flex',
          alignItems: 'center',
          justifyContent: 'space-between',
          padding: '0 17px',
          zIndex: 7,
          background: 'linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,.92) 32%, rgba(255,255,255,.98))',
        }}>
          <GlassToolbarButton label="OCR 导入">
            <span style={{ width: 18, height: 20, display: 'grid', placeItems: 'center', fontSize: 16 }}>⌗</span>
          </GlassToolbarButton>
          <GlassToolbarButton label="新建任务">
            <span style={{ fontSize: 26, fontWeight: 350, lineHeight: 1 }}>＋</span>
          </GlassToolbarButton>
        </div>
      );
    }

    function GlassToolbarButton({ children, label }) {
      return (
        <button aria-label={label} style={{
          width: 48,
          height: 48,
          border: '1px solid rgba(255,255,255,.84)',
          borderRadius: '50%',
          display: 'grid',
          placeItems: 'center',
          color: palette.title,
          background: 'rgba(248,248,248,.80)',
          boxShadow: '0 4px 16px rgba(41,46,48,.10), inset 0 0 0 .5px rgba(41,46,48,.06)',
          backdropFilter: 'blur(24px) saturate(145%)',
          WebkitBackdropFilter: 'blur(24px) saturate(145%)',
          cursor: 'pointer',
        }}>{children}</button>
      );
    }

    function HomeScreen({ initialMenuOpen = false }) {
      const [menuOpen, setMenuOpen] = useState(initialMenuOpen);
      const [toast, setToast] = useState('');

      const handleSelect = (message) => {
        setMenuOpen(false);
        setToast(message);
        window.setTimeout(() => setToast(''), 1000);
      };

      return (
        <div style={{ position: 'relative', width: '100%', height: '100%', background: palette.background, overflow: 'hidden' }}>
          <TopNavigation />
          <DateBar menuOpen={menuOpen} setMenuOpen={setMenuOpen} />

          <div style={{
            position: 'absolute',
            top: 116,
            bottom: 0,
            left: 0,
            right: 0,
            overflow: 'hidden',
            paddingBottom: 78,
            background: palette.background,
          }}>
            {tasks.map((task, index) => <TaskRow key={index} task={task} />)}
          </div>

          <BottomToolbar />

          <WeeklyMenu
            menuOpen={menuOpen}
            onClose={() => setMenuOpen(false)}
            onSelect={handleSelect}
          />

          {toast && (
            <div style={{
              position: 'absolute',
              left: '50%',
              bottom: 86,
              transform: 'translateX(-50%)',
              zIndex: 40,
              padding: '9px 13px',
              borderRadius: 12,
              color: '#fff',
              background: 'rgba(35,38,40,.84)',
              boxShadow: '0 8px 24px rgba(0,0,0,.18)',
              backdropFilter: 'blur(18px)',
              fontSize: 12,
              whiteSpace: 'nowrap',
            }}>{toast}</div>
          )}
        </div>
      );
    }

    function PhoneSpecimen({ label, description, initialMenuOpen }) {
      return (
        <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center' }}>
          <div style={{ width: 417, marginBottom: 14, paddingLeft: 8 }}>
            <div style={{ color: palette.title, fontSize: 16, fontWeight: 650 }}>{label}</div>
            <div style={{ marginTop: 4, color: 'rgba(87,92,97,.62)', fontSize: 13 }}>{description}</div>
          </div>
          <IosFrame time="9:41" battery={86}>
            <HomeScreen initialMenuOpen={initialMenuOpen} />
          </IosFrame>
        </div>
      );
    }

    function App() {
      return (
        <main style={{
          width: 1400,
          minHeight: 1120,
          margin: '0 auto',
          padding: '48px 80px 60px',
          background: '#f2f3f5',
        }}>
          <header style={{ textAlign: 'center', marginBottom: 34 }}>
            <div style={{ fontSize: 12, fontWeight: 650, letterSpacing: '.14em', color: 'rgba(87,92,97,.52)' }}>TOGETHER · HOME REVIEW ENTRY</div>
            <h1 style={{ marginTop: 10, fontSize: 28, fontWeight: 700, letterSpacing: '-.035em', color: palette.title }}>首页「本周」入口</h1>
            <p style={{ marginTop: 8, fontSize: 14, color: 'rgba(87,92,97,.68)' }}>入口退场，两条无容器动作从同一锚点依次展开；首页背景保持清晰</p>
          </header>

          <section style={{
            display: 'flex',
            justifyContent: 'center',
            alignItems: 'flex-start',
            gap: 76,
          }}>
            <PhoneSpecimen
              label="常驻态"
              description="列表再长，入口仍停留在日期栏右侧"
              initialMenuOpen={false}
            />
            <PhoneSpecimen
              label="展开态"
              description="参考视频的 speed-dial 展开，但不模糊背景"
              initialMenuOpen={true}
            />
          </section>
        </main>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
